name: Keep render worker warm

# Render's free tier spins a service down after ~15 minutes of no inbound
# traffic, and each restart can come back on a different outbound IP. That
# IP churn is what makes Google treat the worker's YouTube session cookies
# as suspicious and invalidate them. Pinging /health well inside that
# 15-minute window keeps the instance (and its IP) stable indefinitely, for
# free, using minutes this public repo already gets for free from GitHub.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping worker health endpoint
        run: |
          curl -fsS --max-time 20 https://viralis-render-worker.onrender.com/health || echo "Ping failed (worker may be cold-starting) — next scheduled run will retry."
