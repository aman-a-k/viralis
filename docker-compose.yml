version: '3.8'

services:
  automator:
    build: .
    container_name: ai_automator_prod
    ports:
      - "3000:3000"
    # DATABASE_URL (Postgres), NEXTAUTH_SECRET, NEXTAUTH_URL, AI keys, etc.
    # — see .env.example.
    env_file: .env
    restart: always
    environment:
      - NODE_ENV=production
